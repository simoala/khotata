<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الموقع تحت الصيانة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Cairo,system-ui,sans-serif;background:#0f172a;color:#f8fafc;
     display:grid;place-items:center;padding:24px;line-height:1.8}
.box{max-width:560px;width:100%;background:#1e293b;border:1px solid #334155;
     border-radius:18px;padding:40px 28px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.ico{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;background:#334155;
     display:grid;place-items:center;font-size:34px}
h1{font-size:26px;font-weight:800;margin-bottom:10px}
p{font-size:15px;color:#cbd5e1}
.sep{height:1px;background:#334155;margin:22px 0}
.small{font-size:13px;color:#94a3b8}
@media (max-width:480px){ h1{font-size:22px} .box{padding:30px 20px} }
</style>
</head>
<body>
  <div class="box">
    <div class="ico">🛠️</div>
    <h1>الموقع تحت الصيانة</h1>
    <p>نعتذر عن هذا التوقف المؤقت. يخضع الموقع حاليا لأشغال صيانة وتحديث، وسيعود للعمل في أقرب وقت.</p>
    <div class="sep"></div>
    <p class="small">Site en maintenance — merci de revenir plus tard.</p>
  </div>
</body>
</html>
